[project]
name = "mirabox-stream-dock"
version = "0.1.0"
description = "Mirabox Stream Dock 293S를 macOS에서 직접 구동하는 데몬"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hidapi==0.15.0",
    "pillow==12.3.0",
    "pyobjc-framework-cocoa>=12.2.2",
    "pyside6==6.11.2",
]

[project.scripts]
mirabox = "mirabox.core.daemon:main"
mirabox-app = "mirabox.ui.app:main"
mirabox-probe = "mirabox.core.device:probe"
mirabox-preview = "mirabox.core.preview:main"
mirabox-agent = "mirabox.core.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mirabox"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
]
