[project]
name = "mirabox-stream-dock"
version = "0.1.0"
description = "Mirabox Stream Dock 293S를 macOS에서 직접 구동하는 데몬"
requires-python = ">=3.11"
dependencies = [
    "hidapi==0.15.0",
    "pillow==12.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mirabox"]
