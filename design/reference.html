<!doctype html>
<html lang="ko">
<meta charset="utf-8" />
<title>reference</title>
<!-- 시각적 기준 전용. 빌드에 포함하지 않는다.
     로컬에서 tokens.css 와 같은 폴더에 두고 열 것. -->
<link rel="stylesheet" href="tokens.css" />
<style>
  /* 컴포넌트 스타일만. 토큰은 tokens.css 에 있다. */

  .window {
    height: 100vh;
    display: grid;
    grid-template-rows: var(--titlebar-height) 1fr;
    overflow: hidden;
  }

  /* ---- 타이틀바 ---- */
  .titlebar {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    padding: 0 var(--space-3) 0 var(--traffic-light-inset);
    background: var(--surface-0);
    border-bottom: 0.5px solid var(--border);
  }
  .crumb { display: flex; align-items: center; gap: var(--space-2); font-weight: var(--w-medium); }
  .crumb .sep { color: var(--fg-tertiary); font-weight: var(--w-regular); }
  .crumb .count { color: var(--fg-tertiary); font-family: var(--font-mono); font-size: var(--text-xs); }
  .spacer { flex: 1; }

  .kbd-pill {
    display: flex; align-items: center; gap: var(--space-2);
    padding: 3px var(--space-2);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface-2);
    color: var(--fg-tertiary);
    font: inherit; font-size: var(--text-sm); letter-spacing: inherit;
    transition: color var(--duration-fast) var(--ease-out);
  }
  .kbd-pill:hover { color: var(--fg-secondary); }

  kbd {
    font-family: var(--font-ui);
    font-size: var(--text-xs);
    color: var(--fg-tertiary);
    background: var(--fill);
    border-radius: 3px;
    padding: 0 4px;
  }

  .body {
    display: grid;
    grid-template-columns: var(--sidebar-width) 1fr var(--panel-width);
    min-height: 0;
  }

  /* ---- 사이드바 ---- */
  .sidebar {
    background: var(--surface-0);
    border-right: 0.5px solid var(--border);
    padding: var(--space-2);
    overflow-y: auto;
  }
  .sidebar h2 {
    margin: var(--space-4) var(--space-2) var(--space-1);
    font-size: var(--text-xs); font-weight: var(--w-medium);
    color: var(--fg-tertiary);
  }
  .sidebar h2:first-child { margin-top: var(--space-1); }

  .nav-item {
    display: flex; align-items: center; gap: var(--space-2);
    width: 100%; padding: 5px var(--space-2);
    border: none; border-radius: var(--radius-sm);
    background: transparent; color: var(--fg-secondary);
    font: inherit; letter-spacing: inherit; text-align: left;
    transition: background var(--duration-fast) var(--ease-out);
  }
  .nav-item:hover { background: var(--fill-hover); color: var(--fg); }
  .nav-item[aria-current="true"] {
    background: var(--fill-active); color: var(--fg); font-weight: var(--w-medium);
  }
  .nav-item .badge {
    margin-left: auto; font-family: var(--font-mono);
    font-size: var(--text-xs); color: var(--fg-tertiary);
  }
  .nav-item svg { flex: none; opacity: 0.8; }

  /* ---- 목록 ---- */
  .main { min-height: 0; overflow-y: auto; background: var(--surface-1); }

  .group-header {
    position: sticky; top: 0;
    display: flex; align-items: center; gap: var(--space-2);
    padding: var(--space-2) var(--space-4);
    background: var(--surface-0);
    border-bottom: 0.5px solid var(--border);
    font-size: var(--text-sm); font-weight: var(--w-medium);
    color: var(--fg-secondary);
  }
  .group-header .count { color: var(--fg-tertiary); font-family: var(--font-mono); font-size: var(--text-xs); }

  .row {
    display: flex; align-items: center; gap: var(--space-3);
    width: 100%; height: 34px; padding: 0 var(--space-4);
    border: none; border-bottom: 0.5px solid var(--border);
    background: transparent; color: var(--fg);
    font: inherit; letter-spacing: inherit; text-align: left;
    transition: background var(--duration-fast) var(--ease-out);
  }
  .row:hover { background: var(--surface-2); }
  .row[aria-selected="true"] { background: var(--surface-2); box-shadow: inset 2px 0 0 var(--accent); }
  .row .id { flex: none; width: 62px; font-family: var(--font-mono); font-size: var(--text-xs); color: var(--fg-tertiary); }
  .row .title { flex: 1; font-weight: var(--w-medium); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .labels { display: flex; gap: var(--space-1); flex: none; }
  .row .date { flex: none; width: 44px; text-align: right; font-size: var(--text-xs); color: var(--fg-tertiary); }

  .avatar {
    flex: none; width: 18px; height: 18px; border-radius: 50%;
    display: inline-grid; place-items: center;
    background: var(--fill-active);
    font-size: 9px; font-weight: var(--w-medium); color: var(--fg-secondary);
  }

  .label {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 1px 7px 1px 6px;
    border: 0.5px solid var(--border); border-radius: 9px;
    font-size: var(--text-xs); color: var(--fg-secondary);
  }
  .label i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.7; }

  /* ---- 속성 패널 ---- */
  .panel {
    background: var(--surface-0);
    border-left: 0.5px solid var(--border);
    padding: var(--space-4) var(--space-3);
    overflow-y: auto;
  }
  .panel h3 {
    margin: 0 0 var(--space-3);
    font-size: var(--text-lg); font-weight: var(--w-strong);
    letter-spacing: var(--tracking-title); line-height: var(--leading-tight);
  }
  .prop {
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--space-1) 0; font-size: var(--text-sm);
  }
  .prop dt { color: var(--fg-tertiary); }
  .prop dd { margin: 0; display: flex; align-items: center; gap: 6px; color: var(--fg-secondary); }
  .panel hr { border: none; border-top: 0.5px solid var(--border); margin: var(--space-3) 0; }
  .panel .desc { font-size: var(--text-sm); color: var(--fg-secondary); }
  .panel .btn {
    width: 100%; margin-top: var(--space-3);
    padding: 5px var(--space-3);
    border: none; border-radius: var(--radius-sm);
    background: var(--accent); color: var(--accent-fg);
    font: inherit; font-weight: var(--w-medium); letter-spacing: inherit;
    transition: opacity var(--duration-fast) var(--ease-out);
  }
  .panel .btn:hover { opacity: 0.88; }

  /* ---- 커맨드 팔레트 ---- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.4);
    display: grid; place-items: start center; padding-top: 14vh;
  }
  .overlay[hidden] { display: none; }
  .palette {
    width: 520px; max-width: 90vw;
    background: var(--surface-3);
    border: 0.5px solid var(--border-strong);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  .palette input {
    width: 100%; padding: var(--space-3) var(--space-4);
    border: none; border-bottom: 0.5px solid var(--border);
    background: transparent; color: var(--fg);
    font: inherit; font-size: var(--text-lg); letter-spacing: inherit;
  }
  .palette input::placeholder { color: var(--fg-tertiary); }
  .palette ul { list-style: none; margin: 0; padding: var(--space-1); max-height: 300px; overflow-y: auto; }
  .palette li {
    display: flex; align-items: center; gap: var(--space-3);
    padding: 6px var(--space-3); border-radius: var(--radius-sm);
    color: var(--fg-secondary);
  }
  .palette li[aria-selected="true"] { background: var(--fill-active); color: var(--fg); }
  .palette li .shortcut { margin-left: auto; }
</style>

<body>
<div class="window">
  <header class="titlebar drag-region">
    <div class="crumb">
      <span>피드백</span><span class="sep">/</span><span>받은 항목</span>
      <span class="count">12</span>
    </div>
    <div class="spacer"></div>
    <button class="kbd-pill no-drag" id="open-palette">명령 <kbd>⌘K</kbd></button>
  </header>

  <div class="body">
    <nav class="sidebar">
      <h2>보기</h2>
      <button class="nav-item" aria-current="true">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="7" cy="7" r="5.5"/></svg>
        받은 항목<span class="badge">12</span>
      </button>
      <button class="nav-item">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="7" cy="7" r="5.5" stroke-dasharray="2.5 2.5"/></svg>
        대기<span class="badge">5</span>
      </button>
      <button class="nav-item">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="7" cy="7" r="5.5"/><path d="M7 2.5A4.5 4.5 0 0 1 7 11.5z" fill="currentColor" stroke="none"/></svg>
        처리 중<span class="badge">3</span>
      </button>
      <button class="nav-item">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="7" cy="7" r="5.5"/><path d="M4.5 7.2 6.2 8.9 9.6 5.4"/></svg>
        완료<span class="badge">41</span>
      </button>

      <h2>라벨</h2>
      <button class="nav-item"><span class="label"><i style="color:var(--status-blocked)"></i></span>버그<span class="badge">5</span></button>
      <button class="nav-item"><span class="label"><i style="color:var(--accent)"></i></span>기능 요청<span class="badge">4</span></button>
      <button class="nav-item"><span class="label"><i style="color:var(--status-todo)"></i></span>문서<span class="badge">3</span></button>
    </nav>

    <main class="main">
      <div class="group-header">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="var(--status-doing)" stroke-width="1.3"><circle cx="7" cy="7" r="5.5"/><path d="M7 2.5A4.5 4.5 0 0 1 7 11.5z" fill="var(--status-doing)" stroke="none"/></svg>
        처리 중 <span class="count">3</span>
      </div>

      <button class="row" aria-selected="true">
        <span class="id">FB-142</span>
        <span class="title">내보내기가 60%에서 멈춥니다</span>
        <span class="labels"><span class="label"><i style="color:var(--status-blocked)"></i>버그</span></span>
        <span class="date">14:02</span><span class="avatar">정</span>
      </button>
      <button class="row">
        <span class="id">FB-141</span>
        <span class="title">창을 닫아도 프로세스가 남습니다</span>
        <span class="labels"><span class="label"><i style="color:var(--status-blocked)"></i>버그</span></span>
        <span class="date">11:40</span><span class="avatar">김</span>
      </button>
      <button class="row">
        <span class="id">FB-139</span>
        <span class="title">단축키를 사용자가 바꿀 수 있으면 좋겠습니다</span>
        <span class="labels"><span class="label"><i style="color:var(--accent)"></i>기능</span></span>
        <span class="date">어제</span><span class="avatar">이</span>
      </button>

      <div class="group-header">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="var(--status-todo)" stroke-width="1.3"><circle cx="7" cy="7" r="5.5" stroke-dasharray="2.5 2.5"/></svg>
        대기 <span class="count">5</span>
      </div>

      <button class="row">
        <span class="id">FB-138</span>
        <span class="title">다크 모드에서 사이드바 구분선이 보이지 않음</span>
        <span class="labels"><span class="label"><i style="color:var(--status-blocked)"></i>버그</span></span>
        <span class="date">어제</span><span class="avatar">박</span>
      </button>
      <button class="row">
        <span class="id">FB-137</span>
        <span class="title">설치 문서의 3번과 4번 순서가 뒤바뀐 것 같습니다</span>
        <span class="labels"><span class="label"><i style="color:var(--status-todo)"></i>문서</span></span>
        <span class="date">월</span><span class="avatar">최</span>
      </button>
      <button class="row">
        <span class="id">FB-135</span>
        <span class="title">파일 여러 개를 한 번에 끌어다 놓고 싶습니다</span>
        <span class="labels"><span class="label"><i style="color:var(--accent)"></i>기능</span></span>
        <span class="date">월</span><span class="avatar">정</span>
      </button>
      <button class="row">
        <span class="id">FB-134</span>
        <span class="title">자동 저장 간격을 조절할 수 있나요</span>
        <span class="labels"><span class="label"><i style="color:var(--accent)"></i>기능</span></span>
        <span class="date">일</span><span class="avatar">한</span>
      </button>
    </main>

    <aside class="panel">
      <h3>내보내기가 60%에서 멈춥니다</h3>
      <dl>
        <div class="prop"><dt>상태</dt><dd>
          <svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="var(--status-doing)" stroke-width="1.3"><circle cx="7" cy="7" r="5.5"/><path d="M7 2.5A4.5 4.5 0 0 1 7 11.5z" fill="var(--status-doing)" stroke="none"/></svg>처리 중</dd></div>
        <div class="prop"><dt>우선순위</dt><dd>높음</dd></div>
        <div class="prop"><dt>담당</dt><dd><span class="avatar">정</span>정하윤</dd></div>
        <div class="prop"><dt>라벨</dt><dd><span class="label"><i style="color:var(--status-blocked)"></i>버그</span></dd></div>
        <div class="prop"><dt>버전</dt><dd>2.4.1</dd></div>
      </dl>
      <hr />
      <p class="desc selectable">
        2GB 를 넘는 파일에서만 재현됩니다. 진행률이 60% 부근에서 멈추고,
        취소를 눌러도 실제 종료까지 20초 정도 걸립니다.
      </p>
      <hr />
      <div class="prop"><dt>보고</dt><dd>오늘 14:02</dd></div>
      <div class="prop"><dt>환경</dt><dd>macOS 26.1 · M2</dd></div>
      <button class="btn">이슈로 만들기</button>
    </aside>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="palette" role="dialog" aria-label="명령">
    <input id="palette-input" placeholder="명령을 입력하거나 검색" />
    <ul>
      <li aria-selected="true">이슈로 만들기 <kbd class="shortcut">⌘⇧I</kbd></li>
      <li>담당자 변경 <kbd class="shortcut">A</kbd></li>
      <li>상태 변경 <kbd class="shortcut">S</kbd></li>
      <li>라벨 추가 <kbd class="shortcut">L</kbd></li>
      <li>보관 <kbd class="shortcut">⌘⌫</kbd></li>
    </ul>
  </div>
</div>

<script>
  // 키보드 경로의 기준. 실제 앱에서는 shadcn/ui 의 Command 컴포넌트로 구현한다.
  const rows = [...document.querySelectorAll(".row")];
  const select = (el) => {
    rows.forEach((r) => r.removeAttribute("aria-selected"));
    el.setAttribute("aria-selected", "true");
    el.scrollIntoView({ block: "nearest" });
  };
  rows.forEach((r) => r.addEventListener("click", () => select(r)));

  const overlay = document.getElementById("overlay");
  const input = document.getElementById("palette-input");
  const open = () => { overlay.hidden = false; input.value = ""; input.focus(); };
  const close = () => { overlay.hidden = true; };
  document.getElementById("open-palette").addEventListener("click", open);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });

  document.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); open(); return; }
    if (e.key === "Escape") { close(); return; }
    if (!overlay.hidden) return;
    const i = rows.findIndex((r) => r.hasAttribute("aria-selected"));
    if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); select(rows[Math.min(i + 1, rows.length - 1)]); }
    if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); select(rows[Math.max(i - 1, 0)]); }
  });
</script>
</body>
</html>
